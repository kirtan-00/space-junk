<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPACE JUNK // K. PUROHIT</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;background:#03040a}
:root{--acc:#3fe9ff;--accA:rgba(63,233,255,.35);--cs:1}
body{font-family:"Space Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;color:#cfe4ee;cursor:none;user-select:none}
canvas{position:fixed;left:0;top:0;width:100vw!important;height:100vh!important;display:block}
/* phosphor: every piece of chrome text glows in the phase accent and splits red/blue with speed */
.ph{color:var(--acc);text-shadow:0 0 6px currentColor,0 0 18px var(--accA),calc(-1px*var(--cs)) 0 rgba(255,40,80,.55),calc(1px*var(--cs)) 0 rgba(40,220,255,.55)}
.mono{font-family:"Space Mono","SFMono-Regular",Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6}
#hud{position:fixed;inset:0;padding:30px;pointer-events:none;z-index:5;padding:max(30px,env(safe-area-inset-top)) max(30px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(30px,env(safe-area-inset-left))}
.p{position:absolute}
.id{left:30px;top:30px}
.id .nm{font-family:Archivo,sans-serif;font-variation-settings:"wdth" var(--w,125),"wght" 800;font-size:24px;line-height:.92;color:#eef6fa;max-width:200px;
  text-shadow:0 0 6px rgba(238,246,250,.6),0 0 18px var(--accA),calc(-1px*var(--cs)) 0 rgba(255,40,80,.5),calc(1px*var(--cs)) 0 rgba(40,220,255,.5)}
/* bracketed text is the only kind of button: [ LABEL ], brackets in the accent, label white; hover is inverse video and snaps */
.bk{display:inline-block;pointer-events:auto;color:#eef6fa;text-decoration:none;background:none;border:0;font:inherit;cursor:none;padding:2px 0;white-space:nowrap}
.bk i{font-style:normal;color:var(--acc)}
.bk:hover,.bk:focus-visible,.bk.on{background:var(--acc);color:#03040a;outline:0;text-shadow:none}
.bk:hover i,.bk:focus-visible i,.bk.on i{color:#03040a}
.bk:active{color:#03040a;background:var(--acc)}
.bk:active b,.bk:active span{display:inline-block;transform:translateY(1px)}
.bk.jit{transform:translateX(2px)}
.bk[hidden]{display:none}
.cur{display:inline-block;width:.6em;margin-left:.2em;color:var(--acc);vertical-align:-1px}
.cur.off{visibility:hidden}
.contact{right:30px;top:32px;display:flex;align-items:center}
#insp.closing{visibility:visible}
/* the speed readout: Archivo, glow, and a phosphor ghost of the digits from 80 ms ago */
.vel{left:30px;bottom:30px;display:flex;align-items:flex-end;gap:10px}
.vel .up{font-size:22px;line-height:1;color:var(--acc);margin-bottom:8px;text-shadow:0 0 8px currentColor}
.vel .up[hidden]{display:none}
.vel .nw{position:relative}
.vel .n{font-family:Archivo,sans-serif;font-variation-settings:"wdth" var(--w,125),"wght" 300;font-size:86px;line-height:.8;
  color:#eef6fa;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;
  text-shadow:0 0 6px rgba(238,246,250,.5),0 0 22px var(--accA),calc(-1px*var(--cs)) 0 rgba(255,40,80,.45),calc(1px*var(--cs)) 0 rgba(40,220,255,.45)}
.vel .n em{font-style:normal;font-size:28px;color:var(--acc);margin-left:8px;vertical-align:14px;font-variation-settings:"wdth" 100,"wght" 500;text-shadow:0 0 8px currentColor}
.vel .n.ghost{position:absolute;left:0;top:0;opacity:0;pointer-events:none;text-shadow:none;color:var(--acc)}
.vel .n.ghost.show{opacity:.4}
/* the legend: one mono line, bracketed, chips light by inverse video; fades once and never returns */
.keys{right:30px;bottom:34px;white-space:nowrap;transition:opacity 1.2s cubic-bezier(.32,.72,0,1)}
.keys.gone,.keys.pre{opacity:0}
.cap{left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#eef6fa;white-space:nowrap;max-width:90vw;overflow:hidden;
  transition:opacity .25s cubic-bezier(.32,.72,0,1)}
.cap i{color:var(--acc)} .cap.off{opacity:0}
.counter{left:50%;top:32px;transform:translateX(-50%);white-space:nowrap;transition:opacity 1.2s cubic-bezier(.32,.72,0,1)}
.counter.idle{opacity:.4}
.counter .flip{display:inline-block;animation:flip .12s cubic-bezier(.32,.72,0,1)}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.1)}100%{transform:scaleY(1)}}
.skip{right:max(30px,env(safe-area-inset-right));bottom:calc(62px + env(safe-area-inset-bottom));pointer-events:auto}
.snd{right:max(30px,env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));pointer-events:auto}
/* phones: smaller readout and counter, the END stacked in one column over the figure, nothing clipped */
@media (max-width:600px){
 .vel .n{font-size:44px} .vel .n em{font-size:16px;vertical-align:8px} .vel{bottom:calc(22px + env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left))}
 .id{left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top))} .id .nm{font-size:16px;max-width:140px}
 .contact{right:max(18px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top))} .contact .bk{font-size:9px}
 .counter{top:max(46px,calc(env(safe-area-inset-top) + 26px));font-size:9px} .keys{display:none}
 .snd{right:max(18px,env(safe-area-inset-right));font-size:9px} .skip{right:max(18px,env(safe-area-inset-right));font-size:9px}
 #insp{width:min(600px,92vw);bottom:calc(70px + env(safe-area-inset-bottom))} #insp .tv{padding:18px 16px 14px} #insp h2{font-size:26px} #insp p{font-size:11px}
 #ivid{width:min(88vw,calc(38vh * 16 / 9))}
 #end{padding:max(56px,calc(env(safe-area-inset-top) + 40px)) 18px max(70px,calc(env(safe-area-inset-bottom) + 40px))}
 #end .cols{display:flex!important;grid-template-columns:none;flex-direction:column;align-items:center;margin-top:4vh;gap:10px}
 #end .left,#end .right{align-items:center;text-align:center;padding:0}
 #end .el{font-size:16px} #end .name{font-size:30px} #end .roles{font-size:12px;letter-spacing:.14em} #end .left .roles{max-width:90vw}
 #end .line{font-size:10.5px;max-width:86vw} #end a.mail{font-size:11px;white-space:normal;word-break:break-all;max-width:88vw}
 #end .links{max-width:90vw;gap:4px 8px} #end .links a{white-space:normal} #end .outro,#end .credit{max-width:88vw;white-space:normal}
 #loader .keys2{font-size:16px} #loader .lhint{font-size:8.5px;white-space:normal;text-align:center;width:88vw;bottom:calc(96px + env(safe-area-inset-bottom))}
}
.keys{right:auto;left:calc(50% + 60px);transform:translateX(-50%);max-width:calc(100vw - 600px);overflow:hidden;font-size:clamp(7px,calc((100vw - 600px) / 78),11px);letter-spacing:.08em}
body.act2 .vel,body.act2 .keys,body.act2 .counter,body.endon .vel,body.endon .keys,body.endon .counter{display:none}
body.endon .id .nm{opacity:.4;transition:opacity .6s cubic-bezier(.32,.72,0,1)}
body.endon .contact{pointer-events:none;opacity:.6}
.skip[hidden]{display:none}
.toast{position:fixed;pointer-events:none;z-index:8;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:#fff;text-shadow:0 1px 1px rgba(3,4,10,.9);transform:translate(-50%,-50%);
  transition:opacity .22s cubic-bezier(.32,.72,0,1),transform .22s cubic-bezier(.32,.72,0,1)}
.toast.off{transform:translate(-50%,calc(-50% - 8px));opacity:0}
.keys span{margin-left:14px}
.keys i{font-style:normal}
.keys b{display:inline-block;font-weight:400;color:#eef6fa;padding:0 3px;transition:none}
.keys b.on{background:var(--acc);color:#03040a;text-shadow:none}
.keys b.dim{opacity:.35;text-decoration:line-through}
#br{position:fixed;width:0;height:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .15s}
#br i{position:absolute;width:14px;height:14px;border:1.5px solid var(--acc)}
#br i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0}
#br i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0}
#br i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0}
#br i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0}
/* the inspect panel: a quiet card. A rule above and below in 22% white, a transparent-black fill, no accent border, no glow, no power-on. */
#insp{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);width:min(520px,84vw);z-index:7;pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .22s cubic-bezier(.32,.72,0,1),transform .22s cubic-bezier(.32,.72,0,1),visibility 0s .22s}
#insp.on{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0);transition:opacity .22s cubic-bezier(.32,.72,0,1),transform .22s cubic-bezier(.32,.72,0,1)}
#insp.closing{visibility:visible}
#insp .tv{position:relative;background:rgba(3,4,10,.72);border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22);padding:18px 22px 16px;text-align:left}
#insp .tv::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.12) 2px 3px)}
#insp .tk{display:none}
#insp .txt{opacity:1}
#insp .k{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);text-shadow:none;min-height:16px}
#insp h2{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 112,"wght" 800;font-size:30px;line-height:1;color:#fff;margin:6px 0 10px;min-height:30px;text-shadow:none}
#insp p{font-size:12.5px;line-height:1.65;color:rgba(255,255,255,.82);letter-spacing:.01em;min-height:20px;max-width:520px}
#insp .row{display:flex;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#insp .row .bk{margin:0}
#insp .row:not(:has(.bk:not([hidden]))){display:none}
#insp .x.note{display:block;margin-top:12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);text-shadow:none}
#insp .x.note[hidden]{display:none}
#insp .x.rel{margin-top:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.45;text-shadow:none}
#insp .cur{display:none}
/* the reel: the panel recentres and a 16:9 frame opens under the text */
#insp.play{bottom:auto;top:46%;transform:translate(-50%,-50%);width:min(960px,86vw)}
#insp.play h2{font-size:26px}
#insp.play .tv{pointer-events:auto}                     /* the scrim around the reel takes the click and lets go */
#iclose{position:absolute;right:12px;top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;z-index:1}
#iclose[hidden]{display:none}
#insp.play p{max-width:560px;margin:0 auto}
#ivid{display:none;pointer-events:auto;margin:16px auto 0;width:min(62vw,calc(42vh * 16 / 9));aspect-ratio:16/9}   /* capped so the panel never reaches the speed readout */
#insp.play #ivid{display:block}
#ivid iframe{display:block;width:100%;height:100%;border:1px solid var(--acc);background:#000}
/* the END */
#end{position:fixed;inset:0;z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:3.5vh 30px 2vh;text-align:center;opacity:0;transition:opacity .6s cubic-bezier(.32,.72,0,1),transform .6s cubic-bezier(.32,.72,0,1)}
/* the figure stands in the middle fifth of the frame: words above the head, two columns either side of the body */
#end .cols{display:grid;grid-template-columns:1fr 36vw 1fr;width:100%;margin-top:14vh;align-items:start}
#end .left{display:flex;flex-direction:column;align-items:flex-end;text-align:right;padding-right:2vw}
#end .right{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding-left:2vw}
#end .left .roles{margin-top:0;max-width:30vw}
#end .right .cta{margin-top:0}
#end .right .links{justify-content:flex-start;max-width:34vw}
#end.on{opacity:1}
#end::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(3,4,10,.15) 0%,rgba(3,4,10,.45) 100%)}   /* a soft dark scrim so white type reads on the bliss sky */
#end .top,#end .cols{position:relative}
#end .roles,#end .line,#end .cta,#end a.mail,#end .links a,#end .outro,#end .credit{text-shadow:0 1px 1px rgba(3,4,10,.9),0 0 6px rgba(3,4,10,.6)}
#end.off{opacity:0;transform:translateY(-28px)}
#end .top,#end .bot{display:flex;flex-direction:column;align-items:center}
#end .el{font-family:Archivo,sans-serif;font-variation-settings:"wdth" 112,"wght" 800;font-size:clamp(18px,min(2.4vw,3.6vh),30px);line-height:1.08;color:#eef6fa;min-height:1.08em;
  text-shadow:0 0 8px rgba(238,246,250,.45),0 0 20px var(--accA);opacity:0;transition:opacity .3s}
#end .el.in{opacity:1}
#end .name{--csn:1;margin-top:1.6vh;font-family:Archivo,sans-serif;font-variation-settings:"wdth" 112,"wght" 700;font-size:clamp(30px,min(5.4vw,7.6vh),64px);line-height:.95;color:#eef6fa;
  text-shadow:0 0 8px rgba(238,246,250,.5),0 0 24px var(--accA),calc(-1px*var(--csn)) 0 rgba(255,40,80,.6),calc(1px*var(--csn)) 0 rgba(40,220,255,.6);
  opacity:0;transform:translateY(30px) scale(.92);transition:transform .8s cubic-bezier(.32,.72,0,1),opacity .3s,text-shadow .9s cubic-bezier(.32,.72,0,1)}
#end .name.in{opacity:1;transform:none}
#end .name.split{--csn:5}
#end .roles{margin-top:12px;font-family:Archivo,sans-serif;font-variation-settings:"wdth" 112,"wght" 600;font-size:clamp(12px,min(2.2vw,3vh),26px);letter-spacing:.2em;text-transform:uppercase;color:#eef6fa;text-shadow:0 0 8px rgba(238,246,250,.4),0 0 18px var(--accA);opacity:0;transform:translateY(16px);transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .3s}
#end .roles.in{opacity:1;transform:none}
#end .line{margin-top:14px;font-size:11.5px;letter-spacing:.04em;color:#cfe4ee;opacity:0;transform:translateY(14px);transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .3s}
#end .line.in{opacity:.7;transform:none}
#end .cta{margin-top:24px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transform:translateY(14px);transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .3s}
#end .cta.in{opacity:1;transform:none}
#end a.mail{margin-top:10px;font-size:13px;letter-spacing:.06em;opacity:0;transform:translateY(14px);transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .3s}
#end a.mail.in{opacity:1;transform:none}
#end .links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:16px;max-width:80vw;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#end .links a{opacity:0;transform:translateY(14px);transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .3s}
#end .links a.in{opacity:1;transform:none}
#end .outro{margin-top:14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transform:translateY(10px);transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .4s}
#end .outro.in{opacity:1;transform:none}
#end .credit{margin-top:8px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .6s cubic-bezier(.32,.72,0,1)}
#end .credit.in{opacity:.45}
/* overlays: grain, scanlines, a slow roll bar */
/* the loader: two instructions, a real progress line, then any key. Under the HUD (wordmark, contact, mute stay visible), under the overlays. */
#loader{position:fixed;inset:0;z-index:4;background:#03040a;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%;
  transition:transform 160ms cubic-bezier(.2,.9,.2,1),opacity 120ms}
#loader.off1{transform:scaleY(.01)} #loader.off2{transform:scale(.01,.01);opacity:0} #loader[hidden]{display:none}
body.loading #counter,body.loading #keys{display:none}
#loader .lc{display:flex;flex-direction:column;align-items:center;gap:26px}
#loader .keys2{display:flex;flex-direction:column;gap:18px;font-size:22px;letter-spacing:.14em}
#loader .keys2 div{display:flex;align-items:baseline;gap:22px}
#loader .keys2 b{font-weight:400;color:#eef6fa}
#loader .bar{position:relative;width:min(420px,60vw);height:1px;background:rgba(127,147,166,.25)}
#loader .bar i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--acc);box-shadow:0 0 8px var(--acc);transition:width .3s cubic-bezier(.32,.72,0,1)}
#loader.ready .bar i{height:2px;top:-.5px;background:#eef6fa;box-shadow:0 0 12px #eef6fa,0 0 24px var(--accA)}
#loader .lstat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;min-height:18px}

#grain,#scan,#roll,#flash{position:fixed;inset:0;pointer-events:none}
#flash{z-index:12;background:#fff;opacity:0;transition:opacity .28s cubic-bezier(.32,.72,0,1)}
#landline{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;pointer-events:none;font-family:Archivo,sans-serif;font-variation-settings:"wdth" 112,"wght" 800;font-size:clamp(18px,3vw,34px);letter-spacing:.04em;color:#eef6fa;text-shadow:0 0 10px rgba(238,246,250,.5),0 0 24px var(--accA);white-space:nowrap;transition:opacity .6s cubic-bezier(.32,.72,0,1)}
#landline.off{opacity:0}
#grain{z-index:11;opacity:.035;background-repeat:repeat;background-size:256px 256px;inset:auto;left:0;top:0;width:calc(100vw + 256px);height:calc(100vh + 256px);will-change:transform}
#scan{z-index:10;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.10) 2px 3px)}
#roll{z-index:10;height:120px;inset:auto 0;top:0;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 60%,rgba(255,255,255,0));will-change:transform}
#cur{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:12;pointer-events:none}
#cur .o{position:absolute;inset:0;border:1px solid rgba(255,194,71,.5);border-radius:50%;transition:transform .12s}
#cur .d{position:absolute;inset:9px;border-radius:50%;background:#ffc247;box-shadow:0 0 12px rgba(255,194,71,.9)}
body.brake #cur .o{transform:scale(1.7)}
body.slow #cur .o{border-color:#ff2d78;transform:scale(2.4)}
:root{--ink:#101218}
.ph,.id .nm,.vel .n,.vel .n em,.bk,.bk i,#insp .tv,#insp h2,#insp p{transition:color .4s cubic-bezier(.32,.72,0,1),background-color .4s cubic-bezier(.32,.72,0,1),border-color .4s cubic-bezier(.32,.72,0,1),text-shadow .4s cubic-bezier(.32,.72,0,1)}
body.inv .ph,body.inv .bk,body.inv .bk i,body.inv .id .nm,body.inv .vel .n,body.inv .vel .n em,body.inv .keys b,body.inv .cur{color:var(--ink);text-shadow:0 0 6px rgba(255,255,255,.7),0 0 14px rgba(255,255,255,.35)}
body.inv .bk:hover,body.inv .bk:focus-visible,body.inv .bk.on,body.inv .keys b.on{background:var(--ink);color:#f2f1ec}
